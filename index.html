<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotspot Editor</title>
    <meta
      name="description"
      content="Trace, tag, and export interactive image hotspots."
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header>
      <h1>Hotspot Editor</h1>

      <div class="actions">
        <div class="theme-switch">
          <button class="theme-btn" data-set-theme="light">Day</button>
          <span class="theme-divider">·</span>
          <button class="theme-btn" data-set-theme="dark">Night</button>
        </div>

        <label class="load-btn" for="file">Load image</label>
        <input id="file" type="file" accept="image/*" hidden />
        <button id="export" class="ink" disabled>Export</button>
      </div>
    </header>

    <main>
      <aside>
        <h2>Regions</h2>
        <ul class="region-list" id="regions"></ul>
        <button id="new-region" class="new-region" disabled>
          + New region
        </button>
      </aside>

      <div class="stage" id="stage">
        <div class="drop-zone">
          <h3>Drop an image to start.</h3>
          <p>Anywhere on this page — or use <em>Load image</em>.</p>
          <div class="rule"></div>
          <p>
            Trace regions with the pen tool, name them, and export a
            self-contained interactive file.
          </p>
        </div>
      </div>

      <div class="status" id="status" hidden>
        <em id="status-mode">Drawing new</em>
        <span class="status-hints" id="status-hints"></span>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
